server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:file:./data/authdb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidationPleaseChangeThisInProduction
  expiration: 86400000

logging:
  level:
    com.electricitybilling.auth: DEBUG
