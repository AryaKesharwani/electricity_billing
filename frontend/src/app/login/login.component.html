<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success">
      <strong>Success!</strong> {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-error">
      <strong>Error!</strong> {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="userName">User Name <span class="required">*</span></label>
        <input
          type="text"
          id="userName"
          formControlName="userName"
          [class.invalid]="isFieldInvalid('userName')"
          placeholder="Enter Email, User ID, or Consumer ID"
          autocomplete="username"
        />
        <span *ngIf="isFieldInvalid('userName')" class="error-text">
          {{ getFieldError('userName') }}
        </span>
        <small class="hint">You can use your email, user ID, or consumer ID to login</small>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.invalid]="isFieldInvalid('password')"
          placeholder="Enter Password"
          autocomplete="current-password"
        />
        <span *ngIf="isFieldInvalid('password')" class="error-text">
          {{ getFieldError('password') }}
        </span>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading || loginForm.invalid"
        >
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>
      </div>
    </form>

    <div class="footer-links">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
      <p><a routerLink="/home">Back to Home</a></p>
    </div>
  </div>
</div>
